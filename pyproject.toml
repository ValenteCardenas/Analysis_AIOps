[project]
name = "openstack-aiops-project"
version = "0.1.0"
description = "AIOps analysis project for OpenStack fault injection datasets"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "huggingface_hub",
    "seaborn>=0.13.2",
    "matplotlib>=3.11.0",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
    "scikit-learn>=1.9.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
    "playwright>=1.61.0",
]
